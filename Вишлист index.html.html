<!doctype html><html lang="ru"><head><meta charset="utf-8" data-keep=""><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep=""><link rel="preconnect" href="https://fonts.googleapis.com" data-keep=""><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet" data-keep=""><title>Вишлист камушка</title><style data-keep="">
:root{
  --bg:#fbefe8; --card:#fff8f3; --ink:#5a4150; --soft:#8c7080;
  --pig:#f4b8c1; --pig-d:#e58fa0; --sage:#cfe0c8; --lav:#d9d0ec; --butter:#f7e3a8; --peach:#f8cdb5; --line:#efd9cf;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2c2229; --card:#3a2d36; --ink:#f5e6df; --soft:#bfa7b2;
    --pig:#c98595; --pig-d:#e9a3b3; --sage:#6f8a6c; --lav:#7d73a0; --butter:#b39a52; --peach:#b9806a; --line:#4d3c47;
  }
}
:root[data-theme="dark"]{
  --bg:#2c2229; --card:#3a2d36; --ink:#f5e6df; --soft:#bfa7b2;
  --pig:#c98595; --pig-d:#e9a3b3; --sage:#6f8a6c; --lav:#7d73a0; --butter:#b39a52; --peach:#b9806a; --line:#4d3c47;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Nunito,system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 110px}
header{padding:48px 0 40px;text-align:center}
h1{font:600 clamp(38px,8vw,64px)/1.05 Fredoka,Nunito,sans-serif;margin:0 0 10px}
.sub{color:var(--soft);max-width:30em;margin:0 auto}
.scene{display:flex;justify-content:center;align-items:flex-end;height:92px;margin-top:26px}
.pb{display:block;margin:0 -4px}
.pb.a{width:70px;height:42px;border-radius:58% 42% 50% 50%/62% 56% 44% 38%;background:var(--lav)}
.pb.b{width:46px;height:30px;border-radius:46% 54% 42% 58%/60% 48% 52% 40%;background:var(--butter)}
.pb.c{width:84px;height:50px;border-radius:50% 50% 44% 56%/58% 60% 40% 42%;background:var(--sage)}
.pb.d{width:38px;height:26px;border-radius:55% 45% 52% 48%/55% 50% 50% 45%;background:var(--peach)}
.pig{width:96px;height:77px;margin:0 6px;flex:none}
.pig.small{width:72px;height:58px;transform:scaleX(-1)}
.tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 30px}
.tab{font:600 15px Nunito,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);padding:8px 18px;cursor:pointer;border-radius:46% 54% 50% 50%/62% 58% 42% 38%}
.tab[aria-pressed="true"]{background:var(--pig);border-color:var(--pig)}
:focus-visible{outline:3px solid var(--pig-d);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{position:relative;background:var(--card);border:2px solid var(--line);padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;
  border-radius:36px 44px 38px 46px/44px 36px 46px 38px;transition:opacity .25s}
.card:nth-child(3n+2){border-radius:46px 36px 44px 38px/38px 46px 36px 44px}
.card:nth-child(3n){border-radius:40px 48px 36px 44px/46px 40px 44px 36px}
.card>h2,.card>p,.card>.price,.card>.row{margin-left:8px;margin-right:8px}
.ph{height:170px;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:30px 38px 32px 40px/38px 30px 40px 32px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .pig{width:72px;height:58px;margin:0}
.c0 .ph,.c0 .price{background:var(--sage)} .c1 .ph,.c1 .price{background:var(--lav)}
.c2 .ph,.c2 .price{background:var(--butter)} .c3 .ph,.c3 .price{background:var(--peach)}
.card h2{font:600 22px/1.2 Fredoka,Nunito,sans-serif;margin-top:0;margin-bottom:0}
.card p{margin-top:0;margin-bottom:0;color:var(--soft);font-size:15px;white-space:pre-line}
.price{align-self:flex-start;font:600 15px Nunito,sans-serif;padding:5px 16px;border-radius:55% 45% 50% 50%/60% 55% 45% 40%;color:#5a4150}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.btn{font:700 14px Nunito,sans-serif;border:0;cursor:pointer;padding:9px 16px;border-radius:999px;background:var(--pig);color:#5a4150;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);padding:7px 14px}
.btn[disabled]{opacity:.45;cursor:default}
.card.taken{opacity:.55}
.card.taken h2{text-decoration:line-through;text-decoration-color:var(--pig-d)}
.badge{display:none;position:absolute;top:-10px;right:18px;background:var(--pig-d);color:#fff;font:700 13px Nunito,sans-serif;padding:4px 14px;border-radius:999px;z-index:1}
.card.taken .badge{display:block}
.empty{text-align:center;color:var(--soft);padding:30px 0}
footer{margin-top:44px;display:flex;justify-content:center;align-items:flex-end;color:var(--soft);font-size:14px;text-align:center}
.fab,.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 24px rgba(90,65,80,.25)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:10px 14px;width:max-content;max-width:calc(100% - 24px)}
.st{font-size:13px;color:var(--soft);flex-basis:100%;text-align:center}
.mini{display:flex;gap:6px}
.mini .btn{padding:6px 11px}
dialog{width:min(480px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:32px 40px 34px 42px/40px 32px 42px 34px;padding:22px}
dialog::backdrop{background:rgba(60,40,50,.45)}
dialog h3{font:600 24px Fredoka,sans-serif;margin:0 0 12px}
dialog label{display:block;font-weight:700;font-size:14px;margin:10px 0 0}
dialog input,dialog textarea,dialog select{display:block;width:100%;margin-top:4px;font:400 16px Nunito,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:9px 12px}
dialog .row{margin:16px 0 0;padding:0;justify-content:flex-end}
.photo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:24px 30px 26px 32px}
@media (prefers-reduced-motion:no-preference){
  .pig.hop{animation:hop 2.4s ease-in-out infinite}
  @keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
}

try{taken=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
try{const d=sessionStorage.getItem("wl-draft");if(d){D=JSON.parse(d);dirty=true;sessionStorage.removeItem("wl-draft")}}catch(e){}
const safeUrl=u=>{u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return /^https?:\/\/[^\s"<>]+$/i.test(u)?u:""};

const SCENE='<div class="scene" aria-hidden="true"><span class="pb c"></span><span class="pb d"></span><svg class="pig hop"><use href="#pig"/></svg><span class="pb a"></span><span class="pb b"></span><svg class="pig small"><use href="#pig"/></svg><span class="pb d"></span><span class="pb c"></span></div>';
function shell(){
  $("#root").innerHTML='<div class="wrap"><header><h1 id="h1"></h1><p class="sub" id="sub"></p>'+SCENE+'</header><div class="tabs" id="tabs" role="group" aria-label="Категории"></div><main class="grid" id="grid"></main><p class="empty" id="empty" hidden>Здесь пока пусто.</p><footer><svg class="pig small" aria-hidden="true"><use href="#pig"/></svg><span style="margin:0 12px 6px">Отметка «Мне уже дарят» видна только на вашем устройстве.</span></footer></div><div id="bar"></div><dialog id="dlg"></dialog>';
}
function render(){
  if(cur!=="all"&&!D.cats.includes(cur))cur="all";
  document.title=D.title;$("#h1").textContent=D.title;$("#sub").textContent=D.sub;
  $("#tabs").innerHTML=["all",...D.cats].map(k=>'<button class="tab" data-act="tab" data-k="'+esc(k)+'" aria-pressed="'+(k===cur)+'">'+esc(k==="all"?"Всё":k)+'</button>').join("");
  const list=D.items.filter(i=>cur==="all"||i.cat===cur);
  $("#empty").hidden=list.length>0;
  $("#grid").innerHTML=list.map(i=>{
    const ci=Math.max(0,D.cats.indexOf(i.cat))%4,u=safeUrl(i.url),t=!!taken[i.id];
    const photo='<div class="ph">'+(i.img?'<img src="'+esc(i.img)+'" alt="'+esc(i.title)+'">':'<svg class="pig" aria-hidden="true"><use href="#pig"/></svg>')+'</div>';
    const ctl=editing?'<div class="mini"><button class="btn ghost" data-act="up" data-id="'+i.id+'" aria-label="Выше">↑</button><button class="btn ghost" data-act="down" data-id="'+i.id+'" aria-label="Ниже">↓</button><button class="btn ghost" data-act="edititem" data-id="'+i.id+'">Изменить</button><button class="btn ghost" data-act="del" data-id="'+i.id+'">'+(armed===i.id?"Точно?":"Удалить")+'</button></div>'
      :'<button class="btn" data-act="take" data-id="'+i.id+'">'+(t?"Отменить":"Мне уже дарят")+'</button>';
    return '<article class="card c'+ci+(t?" taken":"")+'"><span class="badge">Уже дарят</span>'+photo+
      (i.price?'<span class="price">'+esc(i.price)+'</span>':'')+'<h2>'+esc(i.title)+'</h2>'+(i.note?'<p>'+esc(i.note)+'</p>':'')+
      '<div class="row">'+(u?'<a class="btn ghost" href="'+esc(u)+'" target="_blank" rel="noopener">В магазин</a>':'<span></span>')+(editing?'':ctl)+'</div>'+(editing?'<div class="row">'+ctl+'</div>':'')+'</article>';
  }).join("");
  bar();
}
function bar(){
  const b=$("#bar");
  if(!owner){b.innerHTML="";return}
  b.innerHTML=editing?'<div class="bar"><button class="btn ghost" data-act="add">+ Желание</button><button class="btn ghost" data-act="settings">Настройки</button><button class="btn" data-act="publish"'+(dirty?"":" disabled")+'>Опубликовать</button><button class="btn ghost" data-act="done">Готово</button><span class="st">'+esc(status||(dirty?"Есть неопубликованные изменения":"Изменений нет"))+'</span></div>'
    :'<button class="btn fab" data-act="edit">Редактировать</button>';
}
function openDlg(html){const d=$("#dlg");d.innerHTML=html;d.showModal()}
function prev(){$("#f-prev").innerHTML=draftImg?'<img src="'+esc(draftImg)+'" alt="">':""}
function openItem(id){
  const it=id?D.items.find(x=>x.id===id):{title:"",note:"",price:"",cat:D.cats[0],url:"",img:""};
  draftImg=it.img||"";
  openDlg('<h3>'+(id?"Изменить желание":"Новое желание")+'</h3><label>Название<input id="f-title" value="'+esc(it.title)+'"></label><label>Описание<textarea id="f-note" rows="3">'+esc(it.note)+'</textarea></label><label>Цена<input id="f-price" value="'+esc(it.price)+'" placeholder="например, 1 200 ₴"></label><label>Категория<select id="f-cat">'+D.cats.map(c=>'<option'+(c===it.cat?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select></label><label>Ссылка на магазин<input id="f-url" value="'+esc(it.url)+'" placeholder="https://..."></label><div class="photo"><div id="f-prev"></div><label class="btn ghost" style="margin:0">Выбрать фото<input id="f-file" type="file" accept="image/*" hidden></label><button class="btn ghost" data-act="rmimg">Убрать фото</button></div><div class="row"><button class="btn ghost" data-act="close">Отмена</button><button class="btn" data-act="saveitem" data-id="'+(id||"")+'">Сохранить</button></div>');
  prev();
}
function openSettings(){
  openDlg('<h3>Настройки страницы</h3><label>Заголовок<input id="s-title" value="'+esc(D.title)+'"></label><label>Подзаголовок<textarea id="s-sub" rows="3">'+esc(D.sub)+'</textarea></label><label>Категории (каждая с новой строки)<textarea id="s-cats" rows="5">'+esc(D.cats.join("\n"))+'</textarea></label><div class="row"><button class="btn ghost" data-act="close">Отмена</button><button class="btn" data-act="savesettings">Сохранить</button></div>');
}
function toJpeg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function move(id,d){const a=D.items,i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];dirty=true;status=""}
function buildDoc(){
  const keep=[...document.head.querySelectorAll("[data-keep]")].map(e=>e.outerHTML).join("");
  const title="<title>"+esc(D.title)+"</title>";
  const j=JSON.stringify(D).replace(/</g,"\\u003c");
  return "<!doctype html><html lang=\"ru\"><head>"+keep.replace(/<style/,title+"<style")+"</head><body>"+$("#sprite").outerHTML+'<div id="root"></div><script type="application/json" id="data">'+j+"</scr"+"ipt><script id=\"app\">"+$("#app").textContent+"</scr"+"ipt></body></html>";
}
async function publish(){
  status="Публикую...";bar();
  try{sessionStorage.setItem("wl-draft",JSON.stringify(D))}catch(e){}
  try{await art.publish(buildDoc())}
  catch(e){status=e&&e.code==="conflict"?"Страница уже обновилась, ваши правки сохранены в черновике":"Не получилось опубликовать ("+(e&&e.code||"ошибка")+"). Попробуйте ещё раз";try{sessionStorage.removeItem("wl-draft")}catch(_){ }bar()}
}
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="tab"){cur=el.dataset.k;return render()}
  if(a==="take"){taken[id]?delete taken[id]:taken[id]=1;try{localStorage.setItem(KEY,JSON.stringify(taken))}catch(_){ }return render()}
  if(a==="edit"){editing=true;return render()}
  if(a==="done"){editing=false;armed="";return render()}
  if(a==="add")return openItem(null);
  if(a==="edititem")return openItem(id);
  if(a==="settings")return openSettings();
  if(a==="close")return $("#dlg").close();
  if(a==="rmimg"){draftImg="";return prev()}
  if(a==="up"||a==="down"){move(id,a==="up"?-1:1);return render()}
  if(a==="del"){if(armed!==id){armed=id;return render()}D.items=D.items.filter(x=>x.id!==id);armed="";dirty=true;status="";return render()}
  if(a==="saveitem"){
    const t=$("#f-title").value.trim();if(!t){$("#f-title").focus();return}
    const o={id:id||"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:t,note:$("#f-note").value.trim(),price:$("#f-price").value.trim(),cat:$("#f-cat").value,url:$("#f-url").value.trim(),img:draftImg};
    if(id)D.items=D.items.map(x=>x.id===id?o:x);else D.items.push(o);
    dirty=true;status="";$("#dlg").close();return render();
  }
  if(a==="savesettings"){
    D.title=$("#s-title").value.trim()||"Мой вишлист";D.sub=$("#s-sub").value.trim();
    const c=$("#s-cats").value.split("\n").map(x=>x.trim()).filter(Boolean);
    D.cats=c.length?[...new Set(c)]:D.cats;
    D.items.forEach(i=>{if(!D.cats.includes(i.cat))i.cat=D.cats[0]});
    dirty=true;status="";$("#dlg").close();return render();
  }
  if(a==="publish"&&dirty)return publish();
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="f-file"||!e.target.files[0])return;
  try{draftImg=await toJpeg(e.target.files[0]);prev()}catch(_){ }
});
shell();render();
(async()=>{
  try{
    if(typeof claude==="undefined")return;
    const u=await claude.use("user"),a=await claude.use("artifact");
    if(u&&a&&await u.isOwner()){owner=true;art=a;if(dirty)editing=true;render()}
  }catch(e){}
})();
</script></body></html>
